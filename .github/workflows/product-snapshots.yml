name: Product snapshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/product-snapshots.yml']
permissions:
  contents: write
concurrency:
  group: product-snapshots
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Build current source
        run: dotnet publish src/OpsisNewsCrawler.App/OpsisNewsCrawler.App.csproj -c Release -o "${{ runner.temp }}/crawler-snapshot-build"
      - name: Render real application screens
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'crawler-snapshot-build/OpsisNewsCrawler.exe'
          $out = Join-Path $env:RUNNER_TEMP 'product-snapshots'
          New-Item -ItemType Directory -Force $out | Out-Null
          $config = Join-Path $env:RUNNER_TEMP 'crawler-snapshot-config.json'
          foreach ($mode in @('snapshot','snapshot-analytics','snapshot-bar','snapshot-welcome','snapshot-suite','snapshot-minimise','snapshot-portfolio')) {
            $folder = Join-Path $out $mode
            New-Item -ItemType Directory -Force $folder | Out-Null
            $target = if ($mode -in @('snapshot-bar','snapshot-suite','snapshot-minimise','snapshot-portfolio')) { Join-Path $folder "$mode.png" } else { $folder }
            $p = Start-Process -FilePath $exe -ArgumentList @("--$mode", ('"' + $target + '"'), '--config', ('"' + $config + '"')) -PassThru
            if (!$p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "Timeout: $mode" }
            if ($p.ExitCode -ne 0) { throw "Capture failed: $mode ($($p.ExitCode))" }
          }
      - name: Capture full-height settings and additional hazard views
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'crawler-snapshot-build/OpsisNewsCrawler.exe'
          $out = Join-Path $env:RUNNER_TEMP 'product-snapshots'
          $config = Join-Path $env:RUNNER_TEMP 'crawler-snapshot-config.json'
          $tall = Join-Path $out 'settings-full-height'
          $hazards = Join-Path $out 'hazards'
          New-Item -ItemType Directory -Force $tall,$hazards | Out-Null
          function Capture([string]$mode,[string]$target,[string[]]$extraArgs=@()) {
            $argsList = @("--$mode", ('"' + $target + '"')) + $extraArgs + @('--config', ('"' + $config + '"'))
            $p = Start-Process -FilePath $exe -ArgumentList $argsList -PassThru
            if (!$p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "Timeout: $mode" }
            if ($p.ExitCode -ne 0 -or !(Test-Path $target)) { throw "Capture failed: $mode" }
          }
          $tabs = @(Get-ChildItem (Join-Path $out 'snapshot') -Filter 'tab*.png' -File)
          foreach ($tab in $tabs) {
            if ($tab.BaseName -match '^tab(\d+)$') {
              $index = $Matches[1]
              Capture 'snapshot-tall' (Join-Path $tall ("tab-{0:D2}.png" -f [int]$index)) @($index,'2200')
            }
          }
          foreach ($mode in @('snapshot-live-icon','snapshot-hazard-bar','snapshot-hazard-icons')) {
            Capture $mode (Join-Path $hazards "$mode.png")
          }
      - name: Validate and publish gallery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:RUNNER_TEMP 'product-snapshots'
          $files = @(Get-ChildItem $src -Recurse -File -Filter '*.png')
          if ($files.Count -lt 60) { throw "Too few screenshots: $($files.Count)" }
          Add-Type -AssemblyName System.Drawing
          foreach ($file in $files) {
            $image = [Drawing.Image]::FromFile($file.FullName)
            try { if ($image.Width -lt 32 -or $image.Height -lt 32) { throw "Invalid image: $($file.Name)" } } finally { $image.Dispose() }
          }
          $dest = 'docs/product-snapshots'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Force $dest | Out-Null
          $lines = @('# Application screenshots / Στιγμιότυπα εφαρμογής', '', "Source commit: $env:GITHUB_SHA", '', 'Rendered by the actual application on Windows CI. Analytics and hazard illustrations use sample data; full-height settings reveal lower cards. These are visual previews, not end-to-end acceptance tests.', '')
          foreach ($file in ($files | Sort-Object FullName)) {
            $relative = [IO.Path]::GetRelativePath($src, $file.FullName).Replace('\','/')
            $target = Join-Path $dest $relative
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item $file.FullName $target
            $lines += @("### $relative", '', "![$relative]($relative)", '')
          }
          $lines | Set-Content "$dest/README.md" -Encoding utf8
          $readme = Get-Content README.md -Raw
          if (!$readme.Contains('docs/product-snapshots/README.md')) {
            $readme += "`n`n## Current screenshot gallery / Νέα στιγμιότυπα`n`n[Browse application screenshots / Προβολή στιγμιοτύπων](docs/product-snapshots/README.md)`n"
            Set-Content README.md $readme -Encoding utf8
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/product-snapshots README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'docs: refresh application screenshots'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Push rejected; no forced update' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-snapshots
          path: ${{ runner.temp }}/product-snapshots/**/*.png
          if-no-files-found: warn
