name: Windows resource soak
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/resource-soak.ps1'
      - '.github/workflows/resource-soak.yml'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Duration per profile in minutes (up to 240)'
        required: true
        default: '30'
      tier:
        description: 'Performance profile'
        type: choice
        options: [Low, Balanced, High]
        default: Low
permissions:
  contents: read
concurrency:
  group: crawler-soak-${{ github.ref }}
  cancel-in-progress: true
jobs:
  soak:
    if: github.event.action != 'labeled' || github.event.label.name == 'extended-soak'
    runs-on: windows-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet build OpsisNewsCrawler.sln --configuration Release
      - name: Run real ticker and record resource samples
        shell: pwsh
        env:
          SOAK_MINUTES: ${{ inputs.minutes || (contains(github.event.pull_request.labels.*.name, 'extended-soak') && '30') || '3' }}
          SOAK_TIER: ${{ inputs.tier || 'Low' }}
        run: ./tools/resource-soak.ps1 -Minutes ([int]$env:SOAK_MINUTES) -Tier $env:SOAK_TIER -Out "$env:RUNNER_TEMP/crawler-soak"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-soak
          path: ${{ runner.temp }}/crawler-soak/*
          if-no-files-found: warn
