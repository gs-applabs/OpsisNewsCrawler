name: Opsis Crawler plugin DLL 1.0.0.0
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-plugin:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Run plugin contract and version regression tests
        shell: pwsh
        run: |
          dotnet test tests/OpsisNewsCrawler.Plugin.Tests/OpsisNewsCrawler.Plugin.Tests.csproj -c Release -m:1 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Crawler plugin regression tests failed' }
      - name: Publish complete plugin folder and verify DLL identity
        shell: pwsh
        run: |
          dotnet publish src/OpsisNewsCrawler.OpsisPlugin/OpsisNewsCrawler.OpsisPlugin.csproj -c Release -o publish-plugin -m:1 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Crawler publish failed' }
          $dll = (Resolve-Path 'publish-plugin/OpsisNewsCrawler.OpsisPlugin.dll').Path
          $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($dll).Version.ToString()
          $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($dll).FileVersion
          if ($assemblyVersion -ne '1.0.0.0' -or $fileVersion -ne '1.0.0.0') {
            throw "Crawler plugin ABI mismatch: $assemblyVersion / $fileVersion"
          }
          Write-Host 'Plugin DLL versions: 1.0.0.0'
          $contract = (Resolve-Path 'publish-plugin/OpsisNewsCrawler.Plugin.Abstractions.dll').Path
          if ([Reflection.AssemblyName]::GetAssemblyName($contract).Version.ToString() -ne '1.0.0.0') {
            throw 'P3 shared plugin contract must be 1.0.0.0'
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opsis-crawler-plugin-dll-1.0.0.0
          path: publish-plugin/
          if-no-files-found: error
          retention-days: 14
